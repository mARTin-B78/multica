name: Build self-hosted web image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable GHCR tag for the custom web frontend
        required: true
        type: string
      app_version:
        description: Version label shown by the web application
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/multica-web:${{ inputs.image_tag }}
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ inputs.app_version }}
