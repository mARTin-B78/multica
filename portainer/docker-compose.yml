# Multica — self-hosted stack (Portainer-ready)
#
# Components: PostgreSQL 17 (pgvector) + Go backend + Next.js frontend.
# Uses the official prebuilt images from GHCR (no build required).
#
# Portainer deployment:
#   - "Web editor":  paste this file. JWT_SECRET is already set below, so it
#     works with zero extra env vars. Add any optional vars in the UI as needed.
#   - "Local path": point Portainer at this folder; the .env next to it is read
#     automatically and can override any value.
#
# Access:
#   Frontend: http://<host>:3000
#   Backend:  http://<host>:8080
#
# Security: ports bind to 127.0.0.1 by default (matches upstream). To reach the
# app from other machines set BIND_ADDR=0.0.0.0 in .env (or the Portainer UI)
# and front it with a TLS-terminating reverse proxy. See README.md.

name: multica

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: multica-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${MULTICA_BACKEND_IMAGE:-ghcr.io/multica-ai/multica-backend}:${MULTICA_IMAGE_TAG:-latest}
    container_name: multica-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    # Read the GitHub App PEM from an owner-only host file, rather than
    # Portainer's one-line environment-variable editor (which flattens PEMs).
    # GITHUB_APP_PRIVATE_KEY_FILE must be an absolute path on the Docker host.
    # Keeping this inline avoids a fragile bind mount to Portainer's Git
    # checkout directory.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        key_file=/run/secrets/multica_github_app_private_key
        if [ ! -s "$$key_file" ]; then
          echo "GitHub App private-key file is missing or empty." >&2
          exit 78
        fi
        key=$$(cat "$$key_file")
        line_count=$$(printf '%s\n' "$$key" | wc -l | tr -d ' ')
        case "$$key" in
          *"-----BEGIN "*"PRIVATE KEY-----"*"-----END "*"PRIVATE KEY-----"*) ;;
          *)
            echo "GitHub App private-key file is not PEM-formatted." >&2
            exit 78
            ;;
        esac
        if [ "$$line_count" -lt 3 ]; then
          echo "GitHub App private-key file must preserve PEM line breaks." >&2
          exit 78
        fi
        export GITHUB_APP_PRIVATE_KEY="$$key"
        unset key
        exec /app/entrypoint.sh
    volumes:
      - backend_uploads:/app/data/uploads
      - type: bind
        source: ${GITHUB_APP_PRIVATE_KEY_FILE:?Set an absolute protected PEM path on the Docker host}
        target: /run/secrets/multica_github_app_private_key
        read_only: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      # Search transactions default to a 64 MB PostgreSQL work_mem ceiling.
      DATABASE_SEARCH_WORK_MEM_MB: ${DATABASE_SEARCH_WORK_MEM_MB:-64}
      # Optional PostgreSQL read replica (eventual-consistency reads).
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      DATABASE_REPLICA_MAX_CONNS: ${DATABASE_REPLICA_MAX_CONNS:-}
      DATABASE_REPLICA_MIN_CONNS: ${DATABASE_REPLICA_MIN_CONNS:-}
      # Optional Redis for the per-IP auth rate limiter. Empty = no-op (fail-open).
      REDIS_URL: ${REDIS_URL:-}
      REDIS_CLUSTER_MODE: ${REDIS_CLUSTER_MODE:-false}
      # Retry transient DB failures across the entrypoint's migrate + API start.
      MULTICA_DATABASE_STARTUP_TIMEOUT: ${MULTICA_DATABASE_STARTUP_TIMEOUT:-3m}
      MULTICA_DATABASE_CONNECT_TIMEOUT: ${MULTICA_DATABASE_CONNECT_TIMEOUT:-5s}
      PORT: "8080"
      METRICS_ADDR: ${METRICS_ADDR:-}
      # REQUIRED. Strong random value (256-bit). Regenerate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a strong random value — generate one with 'openssl rand -hex 32'}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_ENV: ${APP_ENV:-production}
      # Email-based login. Set RESEND_API_KEY for real codes; leave empty to
      # read generated codes from the backend logs instead.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@multica.ai}
      # SMTP relay (Option B). Takes priority over Resend when SMTP_HOST is set.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      SMTP_EHLO_NAME: ${SMTP_EHLO_NAME:-}
      # Optional: Google OAuth login.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/callback}
      # S3 / CloudFront attachment storage. Empty S3_BUCKET = local uploads.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ATTACHMENT_DOWNLOAD_MODE: ${ATTACHMENT_DOWNLOAD_MODE:-auto}
      ATTACHMENT_DOWNLOAD_URL_TTL: ${ATTACHMENT_DOWNLOAD_URL_TTL:-30m}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      # Secret-manager reference for the CloudFront signing key (used when
      # CLOUDFRONT_PRIVATE_KEY is left empty).
      CLOUDFRONT_PRIVATE_KEY_SECRET: ${CLOUDFRONT_PRIVATE_KEY_SECRET:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Local upload dir (fallback when S3_BUCKET is not set).
      LOCAL_UPLOAD_DIR: ${LOCAL_UPLOAD_DIR:-./data/uploads}
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
      # Public URL of the app (no trailing slash). Set when not on localhost.
      MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:3000}
      MULTICA_PUBLIC_URL: ${MULTICA_PUBLIC_URL:-}
      MULTICA_SHUTDOWN_HOLD_DURATION: ${MULTICA_SHUTDOWN_HOLD_DURATION:-}
      MULTICA_RUNTIME_RECONNECT_GRACE: ${MULTICA_RUNTIME_RECONNECT_GRACE:-3h}
      # Signup controls.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}
      # Managed Cloud stays off for self-hosting.
      MULTICA_CLOUD_URL: ${MULTICA_CLOUD_URL:-}
      # GitHub App integration (PR mirroring / repo picker).
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      # Plugin surface (cookie-free second origin routed to this backend).
      MULTICA_PLUGIN_SECRET_KEY: ${MULTICA_PLUGIN_SECRET_KEY:-}
      MULTICA_PLUGIN_SURFACE_ORIGIN: ${MULTICA_PLUGIN_SURFACE_ORIGIN:-}
      MULTICA_PLUGIN_API_URL: ${MULTICA_PLUGIN_API_URL:-}
      MULTICA_PLUGIN_DIR: ${MULTICA_PLUGIN_DIR:-}
      # API URL shown in self-host daemon setup commands.
      MULTICA_DAEMON_SERVER_URL: ${MULTICA_DAEMON_SERVER_URL:-}
      # CIDRs allowed to set X-Forwarded-For for the webhook rate limiter.
      MULTICA_TRUSTED_PROXIES: ${MULTICA_TRUSTED_PROXIES:-}
      # Optional: server-side LLM assist (chat auto-titling / follow-ups).
      # Leave both empty to disable the layer entirely.
      MULTICA_LLM_API_KEY: ${MULTICA_LLM_API_KEY:-}
      MULTICA_LLM_BASE_URL: ${MULTICA_LLM_BASE_URL:-}
      MULTICA_LLM_DEFAULT_MODEL: ${MULTICA_LLM_DEFAULT_MODEL:-}
      MULTICA_LLM_MAX_RETRIES: ${MULTICA_LLM_MAX_RETRIES:-}
      # Lark / Feishu bot integration.
      MULTICA_LARK_SECRET_KEY: ${MULTICA_LARK_SECRET_KEY:-}
      MULTICA_LARK_HTTP_BASE_URL: ${MULTICA_LARK_HTTP_BASE_URL:-}
      MULTICA_LARK_CALLBACK_BASE_URL: ${MULTICA_LARK_CALLBACK_BASE_URL:-}
      MULTICA_LARK_WS_PROXY_URL: ${MULTICA_LARK_WS_PROXY_URL:-}
      # Slack bot integration.
      MULTICA_SLACK_SECRET_KEY: ${MULTICA_SLACK_SECRET_KEY:-}
      # DingTalk bot integration.
      MULTICA_DINGTALK_SECRET_KEY: ${MULTICA_DINGTALK_SECRET_KEY:-}
      # Self-hosted Git provider integration (Forgejo / Gitea / GitLab).
      # Enabled by default in the official self-host stack. Needs a valid
      # MULTICA_VCS_SECRET_KEY to actually work; without it the feature is inert.
      MULTICA_VCS_INTEGRATION_ENABLED: ${MULTICA_VCS_INTEGRATION_ENABLED:-true}
      MULTICA_VCS_SECRET_KEY: ${MULTICA_VCS_SECRET_KEY:-}
      # WeCom smart-bot integration.
      MULTICA_WECOM_SECRET_KEY: ${MULTICA_WECOM_SECRET_KEY:-}
      MULTICA_WECOM_MEDIA_ALLOW_CIDRS: ${MULTICA_WECOM_MEDIA_ALLOW_CIDRS:-}
      MULTICA_WECOM_TRACE: ${MULTICA_WECOM_TRACE:-}
    restart: unless-stopped

  frontend:
    image: ${MULTICA_WEB_IMAGE:-ghcr.io/multica-ai/multica-web}:${MULTICA_IMAGE_TAG:-latest}
    container_name: multica-frontend
    depends_on:
      - backend
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: ${REMOTE_API_URL:-http://backend:8080}
      DOCS_URL: ${DOCS_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      # Product analytics (PostHog). Empty POSTHOG_API_KEY = analytics off.
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      ANALYTICS_ENVIRONMENT: ${ANALYTICS_ENVIRONMENT:-}
      ANALYTICS_DISABLED: ${ANALYTICS_DISABLED:-}
    restart: unless-stopped

volumes:
  pgdata:
  backend_uploads:
